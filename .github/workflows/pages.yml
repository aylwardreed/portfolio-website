name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        # Everything except dotfiles (.git, .github) and the README.
        run: |
          mkdir -p _site
          find . -mindepth 1 -maxdepth 1 ! -name '.*' ! -name README.md ! -name _site -exec cp -r {} _site/ \;
          cp .nojekyll _site/
      - name: Version CSS and JS URLs
        # Gives styles.css and main.js a new URL on every deploy, so browsers
        # and CDN caches fetch the new files instead of serving stale copies.
        run: find _site -name '*.html' -exec sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" {} +
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
